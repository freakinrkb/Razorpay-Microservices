spring:
  application:
    name: config-service

  cloud:
    config.server.git:
      uri: ${GIT_CONFIG_REPO:https://github.com/Anuj-Kumar-Sharma/distributed-razrorpay-config}
      username: ${GIT_USERNAME:}
      password: ${GIT_PASSWORD:}
      default-label: master

server.port: 8888

management:
  endpoints:
    web:
      exposure:
        include: health,info

---

spring:
  config:
    activate:
      on-profile: k8s

  cloud:
    discovery:
      enabled: false

    config.server.git:
      uri: ${GIT_CONFIG_REPO}
      username: ${GIT_USERNAME}
      password: ${GIT_PASSWORD}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
